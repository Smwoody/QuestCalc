
<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuestCalc</title>

    <meta
        name="description"
        content="QuestCalc is a calculator and step-by-step math solver for students."
    >

    <meta name="theme-color" content="#33E85D">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- Progressive Web App Manifest -->
    <link
        rel="manifest"
        href="{{ url_for('static', filename='manifest.json') }}"
    >

    <!-- QuestCalc App Icons -->
    <link
        rel="icon"
        type="image/png"
        href="{{ url_for('static', filename='icon-192.png') }}"
    >

    <link
        rel="apple-touch-icon"
        href="{{ url_for('static', filename='icon-192.png') }}"
    >

    <!-- iOS Home Screen Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black"
    >
    <meta name="apple-mobile-web-app-title" content="QuestCalc">

    <!-- Stylesheet -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>
    <main class="app-container">

        <!-- Header -->
        <header class="app-header">
            <h1>
                <span class="quest">QUEST</span><span class="calc">CALC</span>
            </h1>

            <p>Calculate smarter. Learn step by step.</p>
        </header>

        <!-- Mode Selector -->
        <nav class="mode-selector" aria-label="Calculator modes">
            <button
                type="button"
                class="mode active"
                data-mode="calculator"
            >
                Calculator
            </button>

            <button
                type="button"
                class="mode"
                data-mode="solver"
            >
                Equation Solver
            </button>

            <button
                type="button"
                class="mode"
                data-mode="systems"
            >
                Systems
            </button>
        </nav>

        <!-- Calculator View -->
        <section id="calculator-view" class="calculator-view">
            <p id="mode-label">STANDARD CALCULATOR</p>

            <div class="calculator-display">
                <label for="expression">Expression</label>

                <input
                    type="text"
                    id="expression"
                    placeholder="Enter an expression"
                    autocomplete="off"
                    autocapitalize="off"
                    spellcheck="false"
                >
            </div>

            <div id="keypad" class="keypad"></div>
        </section>

        <!-- Equation Solver View -->
        <section
            id="solver-view"
            class="solver-view"
            hidden
        >
            <h2>Solve an Equation</h2>

            <p>Enter an equation to see your answer and solution steps.</p>

            <label for="equation">Equation</label>

            <input
                type="text"
                id="equation"
                placeholder="Example: 2*x + 5 = 15"
                autocomplete="off"
                autocapitalize="off"
                spellcheck="false"
            >

            <button
                type="button"
                id="solve-button"
                class="primary-button"
            >
                <span>Calculate Result </span>
            </button>
        </section>

        <!-- Systems of Equations View -->
        <section
            id="systems-view"
            class="systems-view"
            hidden
        >
            <h2>Systems of Equations</h2>

            <p>Enter two equations to solve for both variables.</p>

            <label for="equation-one">First equation</label>

            <input
                type="text"
                id="equation-one"
                placeholder="Example: x + y = 10"
                autocomplete="off"
                autocapitalize="off"
                spellcheck="false"
            >

            <label for="equation-two">Second equation</label>

            <input
                type="text"
                id="equation-two"
                placeholder="Example: x - y = 2"
                autocomplete="off"
                autocapitalize="off"
                spellcheck="false"
            >

            <button
                type="button"
                id="solve-system-button"
                class="primary-button"
            >
                <span>Solve System</span>
            </button>
        </section>

        <!-- Results Panel -->
        <section
            id="result-panel"
            class="result-panel"
            aria-live="polite"
            hidden
        >
            <div class="result-header">
                <h2 id="panel-title">Your Result</h2>

                <button
                    type="button"
                    id="clear-button"
                >
                    Clear
                </button>
                
            </div>

            <div
                id="result-content"
                class="result-content"
            ></div>
        </section>

    </main>

    <!-- Main Application JavaScript -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>

    <!-- Progressive Web App Service Worker -->
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", function() {
                navigator.serviceWorker.register(
                    "{{ url_for('static', filename='service-worker.js') }}"
                ).catch(function(error) {
                    console.error(
                        "QuestCalc service worker registration failed:",
                        error
                    );
                });
            });
        }
    </script>
</body>

</html>
